<svg viewBox="0 0 1400 690" width="1400" height="690" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111c36"/></linearGradient></defs>
<rect width="1400" height="690" rx="18" fill="url(#bg)"/>
<text x="60" y="62" font-size="34" font-weight="700" fill="#ffffff">Analysis Flow · Question → Query → Insight</text>
<text x="60" y="92" font-size="16" fill="#94a3b8">Three SQL queries, each answering one business question about the data engineer job market</text>
<rect x="60" y="130" width="400" height="422" rx="14" fill="#0f1e45" stroke="#1d4ed8" stroke-width="2"/>
<path d="M60 184 V144 a14 14 0 0 1 14 -14 H446 a14 14 0 0 1 14 14 V184 Z" fill="#1d4ed8"/>
<text x="80" y="163.0" font-size="19" font-weight="700" fill="#ffffff">Q1 · DEMAND</text>
<text x="440" y="162.0" text-anchor="end" font-size="12" font-weight="700" fill="#ffffff" fill-opacity="0.8" letter-spacing="1.5">MOST IN-DEMAND</text>
<text x="84" y="210" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1.8">QUESTION</text>
<text x="84" y="234" font-size="16"  fill="#e2e8f0">Which skills are most in demand</text>
<text x="84" y="256" font-size="16"  fill="#e2e8f0">for remote data engineers?</text>
<path d="M251.0 270 H269.0 L260.0 283 Z" fill="#1d4ed8"/>
<rect x="61" y="276" width="398" height="92" fill="#ffffff" fill-opacity="0.04"/>
<text x="84" y="302" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1.8">SQL TECHNIQUE</text>
<text x="84" y="326" font-family="Consolas, Menlo, monospace" font-size="13.5"  fill="#e2e8f0">COUNT(*) · GROUP BY skill</text>
<text x="84" y="348" font-family="Consolas, Menlo, monospace" font-size="13.5"  fill="#e2e8f0">ORDER BY demand DESC · LIMIT 10</text>
<path d="M251.0 362 H269.0 L260.0 375 Z" fill="#1d4ed8"/>
<text x="84" y="394" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1.8">OUTPUT</text>
<text x="84" y="418" font-size="16"  fill="#e2e8f0">Top 10 skills ranked by</text>
<text x="84" y="440" font-size="16"  fill="#e2e8f0">number of job postings</text>
<path d="M251.0 454 H269.0 L260.0 467 Z" fill="#1d4ed8"/>
<rect x="61" y="460" width="398" height="92" fill="#ffffff" fill-opacity="0.04"/>
<rect x="70" y="474" width="4" height="64" rx="2" fill="#fde047"/>
<text x="84" y="486" font-size="11" font-weight="700" fill="#fde047" letter-spacing="1.8">INSIGHT</text>
<text x="84" y="510" font-size="16" font-weight="700" fill="#e2e8f0">SQL and Python lead with</text>
<text x="84" y="532" font-size="16" font-weight="700" fill="#e2e8f0">~29,000 postings each</text>
<rect x="60" y="568" width="400" height="38" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#1d4ed8" stroke-opacity="0.6"/>
<text x="260.0" y="592" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="14" fill="#cbd5e1">01_top_demanded_skills.sql</text>
<rect x="500" y="130" width="400" height="422" rx="14" fill="#06281f" stroke="#047857" stroke-width="2"/>
<path d="M500 184 V144 a14 14 0 0 1 14 -14 H886 a14 14 0 0 1 14 14 V184 Z" fill="#047857"/>
<text x="520" y="163.0" font-size="19" font-weight="700" fill="#ffffff">Q2 · SALARY</text>
<text x="880" y="162.0" text-anchor="end" font-size="12" font-weight="700" fill="#ffffff" fill-opacity="0.8" letter-spacing="1.5">HIGHEST PAID</text>
<text x="524" y="210" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1.8">QUESTION</text>
<text x="524" y="234" font-size="16"  fill="#e2e8f0">Which skills command</text>
<text x="524" y="256" font-size="16"  fill="#e2e8f0">the highest salaries?</text>
<path d="M691.0 270 H709.0 L700.0 283 Z" fill="#047857"/>
<rect x="501" y="276" width="398" height="92" fill="#ffffff" fill-opacity="0.04"/>
<text x="524" y="302" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1.8">SQL TECHNIQUE</text>
<text x="524" y="326" font-family="Consolas, Menlo, monospace" font-size="13.5"  fill="#e2e8f0">MEDIAN(salary_year_avg) · COUNT(*)</text>
<text x="524" y="348" font-family="Consolas, Menlo, monospace" font-size="13.5"  fill="#e2e8f0">salary IS NOT NULL · LIMIT 25</text>
<path d="M691.0 362 H709.0 L700.0 375 Z" fill="#047857"/>
<text x="524" y="394" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1.8">OUTPUT</text>
<text x="524" y="418" font-size="16"  fill="#e2e8f0">Top 25 skills with median</text>
<text x="524" y="440" font-size="16"  fill="#e2e8f0">salary and demand metrics</text>
<path d="M691.0 454 H709.0 L700.0 467 Z" fill="#047857"/>
<rect x="501" y="460" width="398" height="92" fill="#ffffff" fill-opacity="0.04"/>
<rect x="510" y="474" width="4" height="64" rx="2" fill="#fde047"/>
<text x="524" y="486" font-size="11" font-weight="700" fill="#fde047" letter-spacing="1.8">INSIGHT</text>
<text x="524" y="510" font-size="16" font-weight="700" fill="#e2e8f0">Kubernetes, Docker, Terraform</text>
<text x="524" y="532" font-size="16" font-weight="700" fill="#e2e8f0">are tied to premium pay</text>
<rect x="500" y="568" width="400" height="38" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#047857" stroke-opacity="0.6"/>
<text x="700.0" y="592" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="14" fill="#cbd5e1">02_top_paying_skills.sql</text>
<rect x="940" y="130" width="400" height="422" rx="14" fill="#1e1240" stroke="#6d28d9" stroke-width="2"/>
<path d="M940 184 V144 a14 14 0 0 1 14 -14 H1326 a14 14 0 0 1 14 14 V184 Z" fill="#6d28d9"/>
<text x="960" y="163.0" font-size="19" font-weight="700" fill="#ffffff">Q3 · OPTIMAL</text>
<text x="1320" y="162.0" text-anchor="end" font-size="12" font-weight="700" fill="#ffffff" fill-opacity="0.8" letter-spacing="1.5">BEST TRADE-OFF</text>
<text x="964" y="210" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1.8">QUESTION</text>
<text x="964" y="234" font-size="16"  fill="#e2e8f0">What skill set balances demand</text>
<text x="964" y="256" font-size="16"  fill="#e2e8f0">and compensation best?</text>
<path d="M1131.0 270 H1149.0 L1140.0 283 Z" fill="#6d28d9"/>
<rect x="941" y="276" width="398" height="92" fill="#ffffff" fill-opacity="0.04"/>
<text x="964" y="302" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1.8">SQL TECHNIQUE</text>
<text x="964" y="326" font-family="Consolas, Menlo, monospace" font-size="13.5"  fill="#e2e8f0">LN(demand) combined with median</text>
<text x="964" y="348" font-family="Consolas, Menlo, monospace" font-size="13.5"  fill="#e2e8f0">HAVING COUNT(*) &gt;= 100</text>
<path d="M1131.0 362 H1149.0 L1140.0 375 Z" fill="#6d28d9"/>
<text x="964" y="394" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1.8">OUTPUT</text>
<text x="964" y="418" font-size="16"  fill="#e2e8f0">Skills ranked by a single</text>
<text x="964" y="440" font-size="16"  fill="#e2e8f0">optimal score</text>
<path d="M1131.0 454 H1149.0 L1140.0 467 Z" fill="#6d28d9"/>
<rect x="941" y="460" width="398" height="92" fill="#ffffff" fill-opacity="0.04"/>
<rect x="950" y="474" width="4" height="64" rx="2" fill="#fde047"/>
<text x="964" y="486" font-size="11" font-weight="700" fill="#fde047" letter-spacing="1.8">INSIGHT</text>
<text x="964" y="510" font-size="16" font-weight="700" fill="#e2e8f0">Cloud (AWS, Azure) and Spark</text>
<text x="964" y="532" font-size="16" font-weight="700" fill="#e2e8f0">pair strong demand with pay</text>
<rect x="940" y="568" width="400" height="38" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#6d28d9" stroke-opacity="0.6"/>
<text x="1140.0" y="592" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="14" fill="#cbd5e1">03_optimal_skills.sql</text>
<rect x="60" y="628" width="1280" height="44" rx="10" fill="#ffffff" fill-opacity="0.06"/>
<text x="84" y="655" font-size="14" fill="#cbd5e1"><tspan font-weight="700" fill="#fde047">Shared foundation</tspan>   job_postings_fact → skills_job_dim → skills_dim   (INNER JOINs, star schema)</text>
<text x="1320" y="655" text-anchor="end" font-size="14" fill="#94a3b8">DuckDB · SQL</text>
</svg>